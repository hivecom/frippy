[package]
name = "frippy"
version = "0.5.1"
authors = ["Jokler <jokler@protonmail.com>"]
repository = "https://github.com/Mavulp/frippy"
readme = "README.md"
license = "MIT"
keywords = ["irc", "bot"]
categories = ["network-programming"]
description = "An IRC Bot"
edition = "2018"

[[bin]]
name = "frippy"
doc = false

[dependencies]
irc = "0.13.6"
log = "0.4.27"
time = { version = "0.3.41", features = ["formatting", "parsing"] }
humantime = "1.3.0"
mlua = { version = "0.10.3", features = ["lua54"] }
reqwest = "0.9.24"
regex = "1.11.1"
lazy_static = "1.5.0"
serde = "1.0.219"
serde_json = "1.0.140"
chrono = "0.4.40"
glob = "0.3.2"
circular-queue = "0.2.7"
failure = "0.1.8"
htmlescape = "0.3.1"
antidote = "1.0.0"
log4rs = "1.3.0"
itertools = "0.8.2"
unicode_names2 = "2.0.0"

frippy_derive = { path = "frippy_derive" }
rand = "0.9.0"
percent-encoding = "2.3.1"

[dependencies.diesel]
version = "2.2.9"
features = ["mysql", "chrono", "r2d2", "time"]

[dependencies.diesel_migrations]
version = "2.2.0"
features = ["mysql"]

[dependencies.r2d2]
version = "0.8.10"
